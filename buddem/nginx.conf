server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Strona jest serwowana spod podscieżki /buddem/ (patrz base w vite.config.js).
  # Coolify/Traefik może przekazać żądanie z prefiksem /buddem LUB bez niego.
  # Jeśli prefiks NIE został obcięty, obcinamy go tutaj (rewrite ... last), żeby
  # dalej pracować na ścieżkach względem roota — assety leżą w /assets, HTML w /.
  location = /buddem { return 301 /buddem/; }
  location /buddem/ {
    rewrite ^/buddem/(.*)$ /$1 last;
  }

  # Zasoby z hashem w nazwie (Vite) — treść nigdy się nie zmienia pod tą nazwą,
  # więc możemy je cache'ować na rok jako niezmienne.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Dokumenty HTML NIE mają hasha w nazwie. Muszą być rewalidowane przy każdym
  # wejściu, inaczej po redeployu przeglądarka ładuje stary, zacache'owany
  # index.html, który wskazuje na nieistniejący już (zahashowany) plik CSS/JS →
  # 404 → strona bez styli i ikon (surowy HTML). "no-cache" = zawsze sprawdź
  # ETag u serwera; przy braku zmian dostajemy tanie 304.
  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache";
  }
}
