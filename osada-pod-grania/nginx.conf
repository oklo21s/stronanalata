server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Przekierowania jako sciezka wzgledna. Domyslnie nginx sklada pelny adres z
  # wlasnego listen 80 i gubi https:// oraz port proxy — przegladarka dostalaby
  # wtedy Location: http://stronanalata.pl/... i wypadala z HTTPS.
  absolute_redirect off;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Strona jest serwowana spod podscieżki /osada-pod-grania/ (patrz base w
  # vite.config.js). Proxy (Traefik/EasyPanel) może przekazać żądanie z
  # prefiksem LUB bez niego. Jeśli prefiks nie został obcięty, obcinamy go tutaj,
  # żeby dalej pracować na ścieżkach względem roota — assety leżą w /assets,
  # HTML w /.
  location = /osada-pod-grania { return 301 /osada-pod-grania/; }
  location /osada-pod-grania/ {
    rewrite ^/osada-pod-grania/(.*)$ /$1 last;
  }

  # Zasoby z hashem w nazwie (Vite) — treść nigdy się nie zmienia pod tą nazwą,
  # więc cache na rok jako niezmienne. =404 zamiast fallbacku na index.html,
  # żeby brakujący plik był widoczny jako błąd, a nie jako HTML z kodem 200.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Dokumenty HTML NIE mają hasha w nazwie. Muszą być rewalidowane przy każdym
  # wejściu, inaczej po redeployu przeglądarka ładuje stary index.html
  # wskazujący na nieistniejący już (zahashowany) plik CSS/JS → 404 → strona
  # bez styli. "no-cache" = zawsze sprawdź ETag; przy braku zmian tanie 304.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
