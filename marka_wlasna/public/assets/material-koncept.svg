  <line x1="138" y1="720" x2="210" y2="720" stroke="#8a7f70" stroke-width="2"/>

  <!-- próbki gramatur -->
  <circle cx="300" cy="800" r="26" fill="#e6a95f"/>
  <circle cx="372" cy="800" r="26" fill="#c96a3c"/>
  <circle cx="444" cy="800" r="26" fill="#efe7d9" stroke="#c9a06a" stroke-width="3"/>
  <rect x="520" y="782" width="360" height="36" rx="8" fill="#ece4d6"/>
