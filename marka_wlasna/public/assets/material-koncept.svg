  <rect x="210" y="200" width="800" height="520" rx="12" fill="none" stroke="#b0561f" stroke-width="4"/>

  <!-- wymiar szerokości -->
  <line x1="210" y1="150" x2="1010" y2="150" stroke="#8a7f70" stroke-width="3"/>
  <path d="M210,150 l22,-11 v22 Z" fill="#8a7f70"/>
  <path d="M1010,150 l-22,-11 v22 Z" fill="#8a7f70"/>
  <line x1="210" y1="138" x2="210" y2="200" stroke="#8a7f70" stroke-width="2"/>
  <line x1="1010" y1="138" x2="1010" y2="200" stroke="#8a7f70" stroke-width="2"/>
  <rect x="560" y="130" width="100" height="40" rx="6" fill="#f6f3ee" stroke="#8a7f70" stroke-width="2"/>
  <line x1="578" y1="150" x2="642" y2="150" stroke="#6c6358" stroke-width="4"/>

  <!-- wymiar wysokości -->
  <line x1="150" y1="200" x2="150" y2="720" stroke="#8a7f70" stroke-width="3"/>
  <path d="M150,200 l-11,22 h22 Z" fill="#8a7f70"/>
  <path d="M150,720 l-11,-22 h22 Z" fill="#8a7f70"/>
