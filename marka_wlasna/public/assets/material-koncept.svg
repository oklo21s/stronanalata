<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-hidden="true">
  <rect width="1200" height="900" fill="#f6f3ee"/>
  <defs>
    <pattern id="knit" width="56" height="44" patternUnits="userSpaceOnUse">
      <path d="M6,36 L28,12 L50,36" fill="none" stroke="#d99a4c" stroke-width="4" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect x="210" y="200" width="800" height="520" rx="12" fill="#efe7d9" stroke="#c9a06a" stroke-width="4"/>
