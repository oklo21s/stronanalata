server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Strona jest serwowana spod podscieżki /krojnia/ (patrz base w vite.config.js).
  # Coolify/Traefik może przekazać żądanie z prefiksem /krojnia LUB bez niego —
  # obsługujemy oba warianty, żeby assety znalazły się niezależnie od konfiguracji.

  # Wariant BEZ obcinania prefiksu: proxy oddaje /krojnia/... — obcinamy go tutaj.
  location = /krojnia { return 301 /krojnia/; }
  location /krojnia/ {
    rewrite ^/krojnia/(.*)$ /$1 break;
    try_files $uri $uri/ $uri.html =404;
  }

  # Zasoby z hashem w nazwie — cache na rok (wariant z obciętym prefiksem).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Wariant Z obcinaniem prefiksu: żądania trafiają już bez prefiksu.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
