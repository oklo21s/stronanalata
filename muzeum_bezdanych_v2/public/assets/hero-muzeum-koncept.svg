<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-label="Wizualizacja koncepcyjna: plakat jubileuszowy w stylu Bauhaus z blokami koloru i wielkimi cyframi">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="960"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="960" fill="#f2ead6"/>
    <!-- bloki koloru -->
    <rect x="0" y="0" width="1280" height="180" fill="#2436c9"/>
    <rect x="0" y="780" width="1280" height="180" fill="#141318"/>
    <!-- wielkie koło -->
    <circle cx="960" cy="470" r="240" fill="#e5361f"/>
    <!-- trójkąt -->
    <path d="M120 720 L 360 720 L 240 470 Z" fill="#f2b60a"/>
    <!-- półkole -->
    <path d="M700 720 a 130 130 0 0 1 260 0 Z" fill="#2436c9"/>
    <!-- wielkie cyfry -->
    <text x="90" y="560" font-family="Arial, Helvetica, sans-serif" font-size="440" font-weight="900" fill="#141318" letter-spacing="-24">90</text>
    <!-- prostokąt akcent -->
    <rect x="600" y="360" width="150" height="150" fill="#141318"/>
    <!-- pasy z podpisem -->
    <text x="60" y="895" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" letter-spacing="8" fill="#f2b60a">90 LAT — MUZEUM MIASTA</text>
    <text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" letter-spacing="8" fill="#f2ead6">JUBILEUSZ — DANE PRZYKŁADOWE</text>
    <!-- gruba rama -->
    <rect x="8" y="8" width="1264" height="944" fill="none" stroke="#141318" stroke-width="16"/>
  </g>
</svg>
