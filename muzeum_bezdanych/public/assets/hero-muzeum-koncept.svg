<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-label="Wizualizacja koncepcyjna: modernistyczny plakat jubileuszowy z abstrakcyjnymi kształtami">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="960" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="960" fill="#efe6d2"/>
    <!-- ziarnista tekstura tła -->
    <g fill="#e4d7bb" opacity="0.55">
      <circle cx="120" cy="820" r="3"/><circle cx="220" cy="880" r="2"/><circle cx="340" cy="840" r="3"/>
      <circle cx="980" cy="120" r="3"/><circle cx="1080" cy="200" r="2"/><circle cx="1180" cy="150" r="3"/>
    </g>
    <!-- niebieska forma -->
    <path d="M90 640 C 260 520, 470 700, 640 560 C 520 780, 300 900, 120 860 Z" fill="#3f3ac9"/>
    <!-- koralowe koło -->
    <circle cx="930" cy="360" r="220" fill="#e14b31"/>
    <!-- piaskowy klin -->
    <path d="M760 720 L 1180 640 L 1120 900 L 700 880 Z" fill="#cf9f63"/>
    <!-- wielkie cyfry jubileuszu -->
    <text x="120" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="440" font-weight="700" fill="#e14b31" letter-spacing="-10">90</text>
    <text x="640" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="440" font-weight="700" fill="#3f3ac9" letter-spacing="-10">90</text>
    <!-- cienka linia i podpis -->
    <line x1="130" y1="560" x2="1120" y2="560" stroke="#1d1b39" stroke-width="3"/>
    <text x="130" y="620" font-family="Arial, sans-serif" font-size="34" letter-spacing="14" fill="#1d1b39">LAT MUZEUM MIASTA — DANE PRZYKŁADOWE</text>
    <!-- ramka -->
    <rect x="6" y="6" width="1268" height="948" rx="8" fill="none" stroke="#1d1b39" stroke-width="10"/>
  </g>
</svg>
